name: Daily Horizon Summary

on:
  schedule:
    # 每天 08:17（Asia/Shanghai）。timezone 为 GitHub 2026-03 新增的原生支持；
    # 避开整点/半点以规避调度拥堵。中国无夏令时，无漂移问题。
    - cron: '17 8 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    # Manual trigger; set test_email to true to only verify SMTP delivery.
    inputs:
      test_email:
        description: 'Only send a test email (skip the full pipeline)'
        required: false
        default: false
        type: boolean

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Test email delivery only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        env:
          EMAIL_PASSWORD: ${{ secrets.QQMAIL }}
        run: uv run python scripts/send_test_email.py

      - name: Run Horizon
        if: ${{ !inputs.test_email }}
        env:
          # Map secrets to environment variables expected by config.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          # QQ mail SMTP authorization code (secret name: QQMAIL)
          EMAIL_PASSWORD: ${{ secrets.QQMAIL }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        if: ${{ !inputs.test_email }}
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: ${{ !inputs.test_email }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
